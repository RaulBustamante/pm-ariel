x-app: &app
  build:
    context: .
    target: app
  image: pm-ariel-app:latest
  env_file:
    - .env.production
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - app_storage:/var/www/html/storage
    - /opt/pm-ariel/backups:/backups
  networks:
    - app_internal
    - app_egress

services:
  app:
    <<: *app
    environment:
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: web
    image: pm-ariel-web:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8088}:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    networks:
      - app_internal
      - proxy_access
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  app_storage:

networks:
  app_internal:
    internal: true
  app_egress: {}
  proxy_access: {}
